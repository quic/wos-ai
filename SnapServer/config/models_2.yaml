# models.yaml — Model Registry
# ==============================
# All models registered here are available to clients via the API.
# You can have all the models present in 1 yaml file which will be mapped to 1 port, and register them on same server. 
# Or create different files so that each model can be called in different port.

# MODEL LOADING STRATEGY
# ==========================
# lazy_load: true  (DEFAULT) — model loads when client first calls it
# lazy_load: false — model pre-loads at server startup

# MODEL LIFECYCLE ENDPOINTS (callable from Swagger UI at /docs)
# -------------------------------------------------------------
#   POST  /v1/models/{id}/load          — load on demand (lazy models)
#   POST  /v1/models/{id}/unload        — free NPU/GPU memory without restart
#   POST  /v1/models/{id}/reload        — unload + reload (picks up config changes)
#   POST  /v1/models/{id}/reset_dialog  — clear KV cache only (ms, not seconds)
#   GET   /v1/models/{id}/system_prompt — read current system prompt
#   PATCH /v1/models/{id}/system_prompt — update system prompt at runtime

models:
  
  # Sample 3 for Cloud models with OpenAI provider— loads when client first requests it
  - id: model_name # gpt-4o etc
    backend: cloud
    provider: openai # OpenAI / Azure / vLLM etc
    model_name: gpt-4o
    api_key_env: OPENAI_API_KEY
    system_prompt: "You are a helpful AI assistant."
    # lazy_load: true  (default — no need to specify)
    # idle_timeout_minutes: 0  (cloud is stateless — no benefit to unloading)
    owned_by: openai


